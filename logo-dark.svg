<svg width="220" height="48" viewBox="0 0 220 48" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="WebApp NG logo">
  <defs>
    <linearGradient id="wngGrad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366F1"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
  </defs>

  <!-- Mark: rounded app tile with a browser bar + ascending "W" -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#wngGrad)"/>
  <!-- browser dots bar -->
  <circle cx="13" cy="13" r="2" fill="#ffffff" fill-opacity="0.9"/>
  <circle cx="20" cy="13" r="2" fill="#ffffff" fill-opacity="0.55"/>
  <circle cx="27" cy="13" r="2" fill="#ffffff" fill-opacity="0.35"/>
  <!-- W mark -->
  <path d="M11 22 L17 36 L24 25 L31 36 L37 22"
        stroke="#ffffff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Wordmark -->
  <text x="58" y="31" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="800" fill="#0B0B14">webapp<tspan fill="#818CF8">.ng</tspan></text>
</svg>
